<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klikšķināšanas Spēle ar Veikalu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Kosmiskais Klikšķinātājs</h1>
    <p>Mērķis: Sakrāj 100000 punktus, lai uzvarētu!</p>
    
    <div id="skaititajs">0</div>
    
    <button id="poga">Klikšķini šeit!</button>

    <h2 id="uzvarasZinojums" style="color: blue; font-size: 30px; margin-top: 20px;"></h2>

    <hr>

    <div class="veikals">
        <h2>Veikals</h2>
        <p>Uzlabojums (Dod +1 punktu pie katra klikšķa)</p>
        <button id="veikalaPoga">Pirkt uzlabojumu (Cena: 10)</button>
        <p id="kludasZinojums" style="color: red; font-weight: bold; margin-top: 10px;"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
